[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained transitive Boa 0.21.1 proc-macro with no safe upgrade; WP-FF-006 is non-shipped prerequisite evidence, unsafe Rust is forbidden, and the exception must be removed or re-authorized before any later product consumer" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
